<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flick Picker Settings</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div class="brand">Flick Picker</div>
      <a class="settings" href="popup.html">Back</a>
    </header>
    <section class="settings-panel">
      <div class="section-heading"><h2>Settings</h2></div>
      <p class="section-note">Connect the extension to the Flick Picker server.</p>
      <label for="backendUrl">Backend URL</label>
      <input class="option-input" id="backendUrl" placeholder="https://flick-picker-api-camerengreen.onrender.com">
      <button class="primary" id="save">Save</button>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
